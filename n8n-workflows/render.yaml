services:
  - type: web
    name: bet-assistant-backend
    env: node
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bet-assistant-db
          property: connectionString

databases:
  - name: bet-assistant-db
    databaseName: betassistant
    plan: free
